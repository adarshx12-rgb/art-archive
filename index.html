<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#151514" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Set the theme before first paint to avoid a flash. Mirrors src/state/theme.tsx.
      (function () {
        var t = null;
        try { t = localStorage.getItem("formfield:theme"); } catch (e) {}
        if (t !== "light") t = "dark";
        document.documentElement.dataset.theme = t;
        if (t === "light") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#F4F2ED");
      })();
    </script>
    <title>FORM / FIELD</title>
    <meta name="description" content="Explore visual styles, discover colour combinations, and build prompts for your next image or video." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
